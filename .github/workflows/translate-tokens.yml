name: Translate Design Tokens

on:
  push:
    # Trigger only when files in the tokens folder are modified
    paths:
      - '*.json' 
      - 'config.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install style-dictionary
          # Add any custom transforms or plugins here if needed

      - name: Verify JSON files exist
        run: ls *.json

      - name: Run Style Dictionary
        run: npx style-dictionary build --config ./config.js

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Platform Files
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "Design Token Bot"
          git config --global user.email "design-tokens@github.com"
          git commit -m "style: auto-generate platform tokens [skip ci]"
          git push
